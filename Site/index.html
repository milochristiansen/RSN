<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
		<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
		
		<link rel="manifest" href="/app.webmanifest">
		<meta name="theme-color" content="#ffff00"/>

		<meta name="description" content="A simple and easy to use RSS notifier. Track all your feeds seamlessly across devices and save battery and bandwidth by only checking one place!">

		<title>RSN - Really Simple Notifier</title>

		<!--
		Blink > Webkit, always, and if you must use Gecko at least try to make them keep up.

		Remove this the very second the slowpokes catch up. Don't even think about supporting IE or non-Blink Edge.
		-->
		<script async src="https://unpkg.com/es-module-shims@0.12.1/dist/es-module-shims.js"></script>

		<!--
		The last two mappings here fix a issue with preact module dependencies.
		I don't know why the imports were done the way they were, but it breaks stuff.

		Mapping them here stops things from breaking and makes it so that there are no 302s and
		possible multiple copies of things.
		-->
		<script type="importmap">
		{"imports": {
			"htm": "https://unpkg.com/htm@3.0.4/dist/htm.module.js?module",
			"csz": "https://unpkg.com/csz@1.2.0/index.js?module",

			"preact": "https://unpkg.com/preact@10.8.2/dist/preact.module.js?module",
			"preact/compat": "https://unpkg.com/preact@10.8.2/compat/dist/compat.mjs",
			"preact/hooks": "https://unpkg.com/preact@10.8.2/hooks/dist/hooks.mjs",
			"preact/debug": "https://unpkg.com/preact@10.8.2/debug/dist/debug.mjs",
			"preact/devtools": "https://unpkg.com/preact@10.8.2/devtools/dist/devtools.mjs",

			"preact-iso": "https://unpkg.com/preact-iso@2.9.2/src/index.js?module",

			"https://unpkg.com/preact@%3E=10/hooks?module": "https://unpkg.com/preact@10.8.2/hooks/dist/hooks.mjs",
			"https://unpkg.com/preact@latest?module": "https://unpkg.com/preact@10.8.2/dist/preact.module.js?module",
			"https://unpkg.com/preact@%3E=10?module": "https://unpkg.com/preact@10.8.2/dist/preact.module.js?module"
		}}
		</script>
	</head>
	<body>
		<script type="module">
		import { html, render } from "/header.js"
		import css from "csz"
		import { Style } from "/components/Style.js"

		import { Router, LocationProvider, lazy, useLocation } from "preact-iso"

		import { AuthProvider, AuthConsumer } from '/components/Auth.js'
		import { LoginLogoutLink } from '/components/LoginLogoutLink.js'

		import { ThemeProvider, ThemeConsumer } from '/components/Theme.js'

		import { AddFeed } from "/components/AddFeed.js"

		import { Main } from '/pages/Main.js'

		// Handle max width properly.
		window.addEventListener("resize", () => {
			document.documentElement.style.setProperty("--window-width", window.innerWidth + "px");
		});

		css`
			:global(html) {
				min-height: 100vh;

				--page-max-width: 1200px;
				--page-width: min(var(--window-width), 1200px);

				--primary-color: #302ae6;
				--secondary-color: #536390;
				--font-color: #424242;
				--bg-color: #ffffff;
				--heading-color: #292922;
				--on-color: #22bb22;
				--off-color: #536390;
				--warning-color: #ff2222;
			}

			:global(html)[data-theme="dark"] {
				--primary-color: #9a97f3;
				--secondary-color: #818cab;
				--font-color: #e1e1ff;
				--bg-color: #161625;
				--heading-color: #818cab;
				--on-color: #22bb22;
				--off-color: #818cab;
				--warning-color: #f56329;
			}

			:global(body) {
				max-width: var(--page-max-width);
				min-height: 100vh;

				margin: 0 auto;
				float: none;

				display: flex;
				flex-direction: column;

				background-color: var(--bg-color);
			}

			:global(*) {
				box-sizing: border-box;
			}

			:global(a) {
				color: var(--font-color);
			}

			:global(h1),
			:global(h2),
			:global(h3),
			:global(h4) {
				color: var(--heading-color);
			}

			:global(p),
			:global(span) {
				color: var(--font-color);
			}

			:global(input),
			:global(button) {
				border-radius: 5px;
				border-style: outset;
				border-width: 3px;
				border-color: var(--secondary-color);

				color: var(--font-color);
				background-color: var(--bg-color);

				&[type="submit"] {
					cursor: pointer;
				}
				&[type="text"] {
					border-style: inset;
				}
			}
		`

		const SiteHeader = Style.header`
			text-align: left;
			margin-bottom: 10px;
		`

		const HeaderHeadline = Style.div`
			display: flex;
			flex-direction: row;
		`

		const HeaderLogo = Style.img`
			background-color: var(--color-fg);
			border-radius: 50%;

			max-width: 50px;

			margin: 10px;
		`

		const HeaderTitle = Style.h1`
			margin: 0;
			margin-top: auto;
			margin-bottom: auto;
			text-align: center;
		`

		const HeaderTitleLink = Style.a`
			color: var(--heading-color);
			text-decoration: none;
		`

		const HeaderLinks = Style.div`
			color: var(--bg-color);
			background-color: var(--heading-color);

			display: flex;
			flex-direction: row;
			justify-content: flex-end;
		`

		const HeaderNavLink = Style.a`
			color: var(--bg-color);
			text-decoration: none;

			padding-right: 10px;
			padding-left: 10px;
		`

		const body = css`
			color: var(--color-fg);
			background-color: var(--bg-color);

			padding-left: 10px;
			padding-right: 10px;

			width: 100%;
		`

		const SiteFooter = Style.footer`
			color: var(--bg-color);
			background-color: var(--color-fg);

			margin-top: auto;
			margin-bottom: 5px;

			text-align: left;
			font-size: 0.5em;
		`

		const FooterParagraph = Style.p`
			display: inline-block;
			margin: 0;
			margin-right: 5px;
			margin-left: 5px;
		`

		const FooterLink = Style.a`
			color: var(--color-fg);
			height: 1em;
		`

		const ThemeSwap = Style.p`
			float: right;
		`

		const Page404 = lazy(() => import('/pages/404.js').then(m => m.E404))
		const LoginLanding = lazy(() => import('/pages/LoginLanding.js').then(m => m.LoginLanding))
		const Unread = lazy(() => import('/pages/Unread.js').then(m => m.Unread))
		const RecentRead = lazy(() => import('/pages/RecentRead.js').then(m => m.RecentRead))
		const Feeds = lazy(() => import('/pages/Feeds.js').then(m => m.Feeds))
		const FeedDetails = lazy(() => import('/pages/FeedDetails.js').then(m => m.FeedDetails))

		render(html`
			<${AuthProvider}><${ThemeProvider}><${LocationProvider}>
				<${SiteHeader}>
					<${HeaderHeadline}>
						<${HeaderLogo} src="/assets/round.svg" alt="" width="50" height="50" />
						<${HeaderTitle}><${HeaderTitleLink} href="/">Really Simple Notifier<//><//>
					<//>
					<${HeaderLinks}>
						<${AuthConsumer}>
							${auth => {
								if (auth.ok) {
									return html`
										<${HeaderNavLink} href="/read/unread">Unread<//>
										<${HeaderNavLink} href="/read/recentread">Recently Read<//>
										<${HeaderNavLink} href="/read/feeds">Feeds<//>
									`
								}
								return null
							}}
						<//>
						<${LoginLogoutLink} as=${HeaderNavLink} />
					<//>
				<//>
				<article class=${body}>
					<${AuthConsumer}>${auth => html`
						<${Router} onRouteChange=${evnt => auth.refresh(evnt)}>
							<${Main} path="/" />

							<${LoginLanding} path="/login-landing" />

							<${Unread} path="/read/unread" />

							<${RecentRead} path="/read/recentread" />

							<${Feeds} path="/read/feeds" />

							<${FeedDetails} path="/read/feed/:id" />

							<${Page404} default />
						<//>
					`}<//>
				</article>
				<${SiteFooter}>
					<${() => {
						const { path } = useLocation()
						return path === '/read/unread' ? html`<${AddFeed} />` : null
					}} />
					<${FooterParagraph}>
						This site runs off a pathetic little system with very limited computing resources, be nice to
						it, it's trying as hard as it can.
					<//>
					<${FooterParagraph}>
						<span>To report issues, get help, etc. send a message to: </span>
						<span dangerouslySetInnerHTML=${{ __html: `<a
							href="&#109;&#97;&#105;&#108;&#116;&#111;&#58;&#109;&#105;&#108;&#111;&#64;&#104;&#116;&#116;&#112;&#115;&#99;&#111;&#108;&#111;&#110;&#115;&#108;&#97;&#115;&#104;&#115;&#108;&#97;&#115;&#104;&#119;&#119;&#119;&#46;&#99;&#111;&#109;"
						>
							&#109;&#105;&#108;&#111;&#64;&#104;&#116;&#116;&#112;&#115;&#99;&#111;&#108;&#111;&#110;&#115;&#108;&#97;&#115;&#104;&#115;&#108;&#97;&#115;&#104;&#119;&#119;&#119;&#46;&#99;&#111;&#109;
						</a>`}}></span>
					<//>
					<${ThemeSwap}>
						<${ThemeConsumer}>
							${data => {
								return html`
									<${FooterLink}
										href="${data.theme == "dark" ? "#light-theme" : "#dark-theme"}"
										onclick=${evnt => data.toggle(evnt)}
									>
										${data.theme == "dark" ? "☀" : "☼"}
									<//>
								`
							}}
						<//>
					<//>
				<//>
			<//><//><//>
		`, document.body)
		</script>
		<noscript>
			<h1>Please enable JavaScript to continue</h1>
			<p>This website requires JavaScript to operate, please enable it to continue.</p>
		</noscript>
	</body>
</html>
