
events {
}

http {
	gzip on;
	gzip_min_length 1024;
	gzip_types application/javascript application/json application/wasm text/tab-separated-values text/css image/svg+xml;

	server {
		listen 80;
		server_name httpscolonslashslashwww.com;
		return 301 https://$host$request_uri;
	}

	server {
		listen 443 ssl;

		server_name httpscolonslashslashwww.com;

		ssl_certificate      /etc/nginx/cert.pem;
		ssl_certificate_key  /etc/nginx/key.pem;

		location / {
			root /usr/share/nginx/html;

			types {
				text/html                 html;
				application/javascript    js mjs;
				application/json          json;
				application/wasm          wasm;
				application/octet-stream  onnx npz whl;
				text/tab-separated-values tsv;
				application/zip           zip;
				text/css                  css;
				image/png                 png;
				image/svg+xml             svg;
				audio/mpeg                mp3;
				audio/wav                 wav;
			}

			default_type application/octet-stream;

			location /stream/overlay/tts/assets/ {
				try_files $uri =404;
				add_header Cache-Control "public, max-age=604800";
			}

			location /stream/overlay/tts/ort/ {
				try_files $uri =404;
				add_header Cache-Control "public, max-age=604800";
			}

			location /stream/overlay/tts/pyodide/ {
				try_files $uri =404;
				add_header Cache-Control "public, max-age=604800";
			}

			location /stream/overlay/tts/ {
				try_files $uri =404;
				add_header Cache-Control "no-cache";
			}

			location /stream/overlay/ {
				try_files $uri /stream/overlay/index.html;
			}

			location /stream/monitor/ {
				try_files $uri /stream/monitor/index.html;
			}

			try_files $uri /index.html;
		}

		

		location /api/ {
			resolver 127.0.0.11;
			proxy_pass http://rsn-app:80;
		}

		location /auth/ {
			resolver 127.0.0.11;
			proxy_pass http://rsn-app:80;
		}

		location /twitch/webhook {
			resolver 127.0.0.11;
			proxy_pass http://twitch-bot:80;
		}

		location /twitch/sse {
			resolver 127.0.0.11;
			proxy_buffering off;
			proxy_cache off;
			chunked_transfer_encoding off;
			proxy_pass http://twitch-bot:80;
		}
	}
}
